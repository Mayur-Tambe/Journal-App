#classpath: list of jars and directories. byte code is stored here
#context-path: url part after domain/8080; which applies for all APIs.
#e.g. http://localhost:8080/journalApp/journal
#if same properties are present in cmd/application.properties/application.yml
#then precedence is cmd -> application.properties -> application.
#command line args -> java -jar jarFileName --server.port=9090

spring:
  application:
    name: journalApp

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    autoindex:
      create: true

server:
  port: 8081
  servlet:
    context-path: /journalApp